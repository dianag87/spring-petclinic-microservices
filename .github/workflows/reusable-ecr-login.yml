name: Reusable ECR Login

on:
  workflow_call:
    inputs:
      aws-region:
        description: AWS region for ECR (e.g. us-east-1)
        required: true
        type: string
    secrets:
      role-arn:
        description: IAM role ARN to assume via OIDC
        required: true
    outputs:
      registry:
        description: ECR registry URL (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com)
        value: ${{ jobs.login.outputs.registry }}

jobs:
  login:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
